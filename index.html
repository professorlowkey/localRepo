<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World Clock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <span class="brand-dot"></span>
      <h1>World Clock</h1>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-panel="clocks" role="tab">World Clocks</button>
      <button class="tab" data-panel="stopwatch" role="tab">Stopwatch</button>
    </nav>
  </header>

  <main>
    <!-- ============ WORLD CLOCKS ============ -->
    <section id="clocks" class="panel active">
      <div class="local-hero">
        <p class="label">Your local time</p>
        <p class="hero-time" id="local-time">--:--:--</p>
        <p class="hero-date" id="local-date">—</p>
      </div>

      <div class="toolbar">
        <label class="toggle">
          <input type="checkbox" id="format-toggle" />
          <span>24-hour format</span>
        </label>
      </div>

      <div class="clock-grid" id="clock-grid">
        <!-- Cards are generated by script.js -->
      </div>
    </section>

    <!-- ============ STOPWATCH ============ -->
    <section id="stopwatch" class="panel">
      <div class="stopwatch-card">
        <p class="label">Stopwatch</p>
        <p class="sw-display" id="sw-display">00:00:00<span class="ms">.00</span></p>

        <div class="sw-controls">
          <button class="btn btn-secondary" id="sw-lap" disabled>Lap</button>
          <button class="btn btn-primary" id="sw-start">Start</button>
          <button class="btn btn-secondary" id="sw-reset" disabled>Reset</button>
        </div>

        <div class="laps">
          <div class="laps-head">
            <span>Lap</span>
            <span>Lap time</span>
            <span>Total</span>
          </div>
          <ol class="laps-list" id="laps-list"></ol>
          <p class="laps-empty" id="laps-empty">No laps yet — press <strong>Lap</strong> while running.</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    Times are calculated from your device clock.
  </footer>

  <script src="script.js"></script>
</body>
</html>
